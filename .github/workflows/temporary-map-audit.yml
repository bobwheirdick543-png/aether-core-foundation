name: temporary-map-audit

on:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan all tracked source maps
        run: |
          set -euo pipefail
          echo "=== MAP CALL COUNT ==="
          git grep -nF '.map(' -- '*.ts' '*.tsx' '*.js' '*.jsx' | wc -l
          echo "=== ALL MAP CALLS ==="
          git grep -nF '.map(' -- '*.ts' '*.tsx' '*.js' '*.jsx' || true
          echo "=== COLLECTION-NAMED MAP CALLS ==="
          git grep -nE '(data|rows|items|results|jobs|tasks|events|messages|entries|candidates|models|projects|versions)[A-Za-z0-9_?.]*\.map[[:space:]]*\(' -- '*.ts' '*.tsx' '*.js' '*.jsx' || true
