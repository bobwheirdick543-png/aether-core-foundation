name: temporary-map-audit

on:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find query-backed map calls without obvious array normalization
        run: |
          python3 - <<'PY'
          import pathlib,re
          roots=[pathlib.Path("src"),pathlib.Path("routes"),pathlib.Path("lib"),pathlib.Path("components"),pathlib.Path("integrations")]
          simple=re.compile(r'\b([A-Za-z_$][A-Za-z0-9_$]*)\s*\.map\s*\(')
          for root in roots:
            if not root.exists(): continue
            for p in root.rglob("*"):
              if p.suffix not in {".ts",".tsx",".js",".jsx"}: continue
              lines=p.read_text(errors="ignore").splitlines()
              for i,line in enumerate(lines):
                m=simple.search(line)
                if not m: continue
                name=m.group(1)
                before="\n".join(lines[max(0,i-50):i+1])
                whole="\n".join(lines)
                if "useQuery" not in before: continue
                guarded=(
                  f"Array.isArray({name})" in whole or
                  f"const {name} = Array.isArray" in whole or
                  f"const {name} =" in whole and "Array.isArray" in before
                )
                if not guarded:
                  print(f"{p}:{i+1}: receiver={name}: {line.strip()[:300]}")
          PY
