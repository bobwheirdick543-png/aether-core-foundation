name: Phase F validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  phase-f:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - name: Install dependencies
        run: bun install
      - name: Production build and route generation
        run: bun run build:dev
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Phase F tests
        run: bunx vitest run src/lib/aether/__tests__/phase-f-research.test.ts src/lib/aether/__tests__/phase-f-completion-gate.test.ts src/lib/aether/aax-web-intelligence.test.ts src/lib/aether/task-runtime.test.ts
