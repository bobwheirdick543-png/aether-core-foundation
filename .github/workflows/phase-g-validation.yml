name: Phase G validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  phase-g:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - name: Install dependencies
        run: bun install
      - name: Production build and route generation
        run: bun run build:dev
      - name: Phase G focused typecheck
        run: bunx tsc -p tsconfig.phase-g.json --noEmit
      - name: Phase G verification tests
        run: bunx vitest run src/lib/aether/verification-engine.test.ts
