name: Phase L Validation
on:
  push:
    branches: [main]
    paths:
      - 'src/lib/aether/scheduler.ts'
      - 'src/lib/aether/scheduler-runtime.ts'
      - 'src/lib/aether/scheduler.functions.ts'
      - 'src/lib/aether/__tests__/scheduler-runtime.test.ts'
      - 'src/lib/aether/tsconfig.phase-l.json'
      - 'supabase/migrations/*phase_l*'
  pull_request:
    paths:
      - 'src/lib/aether/scheduler.ts'
      - 'src/lib/aether/scheduler-runtime.ts'
      - 'src/lib/aether/scheduler.functions.ts'
      - 'src/lib/aether/__tests__/scheduler-runtime.test.ts'
      - 'src/lib/aether/tsconfig.phase-l.json'
      - 'supabase/migrations/*phase_l*'
jobs:
  phase-l:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bunx tsc -p src/lib/aether/tsconfig.phase-l.json --noEmit
      - run: bunx vitest run src/lib/aether/__tests__/scheduler-runtime.test.ts
      - run: bun run build
