name: Phase R Validation
on:
  push:
    branches: [main]
    paths:
      - 'src/lib/aether/battleversia-runtime.ts'
      - 'src/lib/aether/battleversia.functions.ts'
      - 'src/lib/aether/__tests__/battleversia-runtime.test.ts'
      - 'src/routes/_authenticated/battleversia/**'
      - 'src/components/layout/AppShell.tsx'
      - 'tsconfig.phase-r.json'
      - 'supabase/migrations/20260911200000_phase_r_battleversia_core.sql'
      - '.github/workflows/phase-r-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/aether/battleversia-runtime.ts'
      - 'src/lib/aether/battleversia.functions.ts'
      - 'src/lib/aether/__tests__/battleversia-runtime.test.ts'
      - 'src/routes/_authenticated/battleversia/**'
      - 'src/components/layout/AppShell.tsx'
      - 'tsconfig.phase-r.json'
      - 'supabase/migrations/20260911200000_phase_r_battleversia_core.sql'
      - '.github/workflows/phase-r-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.21'
      - run: bun install
      - run: bunx tsc -p tsconfig.phase-r.json --noEmit
      - run: bunx vitest run src/lib/aether/__tests__/battleversia-runtime.test.ts
      - run: bun run build:dev
