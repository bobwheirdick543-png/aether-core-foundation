name: Phase H Validation

on:
  push:
    branches: [main]
    paths:
      - "src/lib/aether/knowledge-curator*"
      - "src/lib/aether/tsconfig.phase-h.json"
      - "src/routes/_authenticated/knowledge.tsx"
      - "src/components/research/VerificationPanel.tsx"
      - "supabase/migrations/*phase_h*"
      - ".github/workflows/phase-h-validation.yml"
  pull_request:
    paths:
      - "src/lib/aether/knowledge-curator*"
      - "src/lib/aether/tsconfig.phase-h.json"
      - "src/routes/_authenticated/knowledge.tsx"
      - "src/components/research/VerificationPanel.tsx"
      - "supabase/migrations/*phase_h*"
      - ".github/workflows/phase-h-validation.yml"

jobs:
  phase-h:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bunx tsc -p src/lib/aether/tsconfig.phase-h.json --noEmit --pretty false
      - run: bunx vitest run src/lib/aether/__tests__/knowledge-curator-engine.test.ts
      - run: bun run build
