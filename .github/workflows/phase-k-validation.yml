name: Phase K Validation
on:
  push:
    branches: [main]
    paths:
      - 'src/lib/aether/notification-delivery.ts'
      - 'src/lib/aether/notification-delivery.functions.ts'
      - 'src/lib/aether/notifications.ts'
      - 'src/lib/aether/notification.functions.ts'
      - 'src/lib/aether/__tests__/notification-delivery.test.ts'
      - 'src/lib/aether/tsconfig.phase-k.json'
      - 'supabase/migrations/*phase_k*'
      - 'docs/architecture/phase-k-completion-record.md'
  pull_request:
    paths:
      - 'src/lib/aether/notification-delivery.ts'
      - 'src/lib/aether/notification-delivery.functions.ts'
      - 'src/lib/aether/notifications.ts'
      - 'src/lib/aether/notification.functions.ts'
      - 'src/lib/aether/__tests__/notification-delivery.test.ts'
      - 'src/lib/aether/tsconfig.phase-k.json'
      - 'supabase/migrations/*phase_k*'
      - 'docs/architecture/phase-k-completion-record.md'
permissions:
  contents: read
jobs:
  phase-k:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bunx tsc -p src/lib/aether/tsconfig.phase-k.json --noEmit
      - run: bunx vitest run src/lib/aether/__tests__/notification-delivery.test.ts
      - run: bun run build
