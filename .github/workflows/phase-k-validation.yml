name: Phase K Validation
on:
  push:
    branches: [main]
    paths:
      - 'src/lib/aether/notification*'
      - 'src/lib/aether/notifications.ts'
      - 'src/lib/aether/agents.ts'
      - 'src/lib/aether/__tests__/notification*'
      - 'src/lib/aether/__tests__/phase-k.integration.test.ts'
      - 'src/lib/aether/tsconfig.phase-k.json'
      - 'src/routes/_authenticated/notification-settings.tsx'
      - 'supabase/migrations/*phase_k*'
      - '.github/workflows/phase-k-validation.yml'
      - 'docs/architecture/phase-k-completion-record.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase-k:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bunx tsc -p src/lib/aether/tsconfig.phase-k.json --noEmit
      - run: bunx vitest run src/lib/aether/__tests__/notification-delivery.test.ts src/lib/aether/__tests__/phase-k.integration.test.ts
      - run: bun run build
