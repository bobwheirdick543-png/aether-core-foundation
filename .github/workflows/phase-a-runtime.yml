name: Phase A Runtime Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  runtime-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install
      - name: Run Phase A runtime unit tests
        run: bun run vitest run src/lib/aether/task-runtime.test.ts
