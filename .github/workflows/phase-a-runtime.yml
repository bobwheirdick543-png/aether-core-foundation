name: Phase A Runtime Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  runtime-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Phase A runtime unit tests
        run: node --experimental-strip-types --test src/lib/aether/task-runtime.test.ts
