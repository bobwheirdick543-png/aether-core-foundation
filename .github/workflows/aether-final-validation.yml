name: Aether Final Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript check
        run: bun x tsc --noEmit
      - name: Unit tests
        run: bun run test
      - name: Lint
        run: bun run lint
      - name: Production build
        run: bun run build
