name: Phase C AAX Validation

on:
  push:
    branches: [main]
    paths:
      - "src/lib/aether/**"
      - "src/lib/admin/**"
      - "src/routes/**"
      - "supabase/migrations/**"
      - "package.json"
      - ".github/workflows/phase-b-orchestrator.yml"
  pull_request:
    paths:
      - "src/lib/aether/**"
      - "src/lib/admin/**"
      - "src/routes/**"
      - "supabase/migrations/**"
      - "package.json"
      - ".github/workflows/phase-b-orchestrator.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: ESLint report
        run: |
          npx eslint . --fix || true
          npx eslint . --format compact || true
      - run: npx tsc --noEmit --pretty false
      - run: npm run build
