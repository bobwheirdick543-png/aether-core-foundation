name: Phase C AAX Validation

on:
  push:
    branches: [main]
    paths:
      - "src/lib/aether/**"
      - "src/lib/admin/**"
      - "src/routes/**"
      - "supabase/migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/phase-b-orchestrator.yml"
  pull_request:
    paths:
      - "src/lib/aether/**"
      - "src/lib/admin/**"
      - "src/routes/**"
      - "supabase/migrations/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/phase-b-orchestrator.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
