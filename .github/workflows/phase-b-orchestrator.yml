name: Phase F Native Research & Operations Validation
on:
  push:
    branches: [main]
    paths: ["src/lib/aether/**", "src/lib/admin/**", "src/lib/workspace/**", "src/routes/**", "supabase/migrations/**", "package.json", "tsconfig.phase-c.json", ".github/workflows/phase-b-orchestrator.yml"]
  pull_request:
    paths: ["src/lib/aether/**", "src/lib/admin/**", "src/lib/workspace/**", "src/routes/**", "supabase/migrations/**", "package.json", "tsconfig.phase-c.json", ".github/workflows/phase-b-orchestrator.yml"]
permissions: { contents: read }
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: https://registry.npmjs.org }
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: ESLint report
        run: |
          npx eslint . --fix || true
          npx eslint . --format compact || true
      - name: Production build and route generation
        run: npm run build
      - name: Phase C TypeScript validation
        run: npx tsc -p tsconfig.phase-c.json --noEmit --pretty false
      - name: AAX, Phase D/E and Phase F tests
        run: npx vitest run src/lib/aether/aax.test.ts src/lib/aether/aax-phase-d.test.ts src/lib/aether/aax-web-intelligence.test.ts src/lib/aether/aether-phase-e.test.ts src/lib/aether/aether-memory-governance.test.ts src/lib/aether/aether-phase-e-completion.test.ts src/lib/aether/aether-memory-deletion.test.ts src/lib/aether/__tests__/phase-f-research.test.ts
