name: Phase D build fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix duplicate saveMemory binding
        shell: bash
        run: |
          set -euo pipefail
          file='src/routes/_authenticated/chat.tsx'
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/_authenticated/chat.tsx')
          s = p.read_text()
          old = 'const stopGeneration = useServerFn(stopAaxGeneration); const saveMemory = useServerFn(saveAaxMemoryCandidate);'
          new = 'const stopGeneration = useServerFn(stopAaxGeneration); const saveMemoryCandidateFn = useServerFn(saveAaxMemoryCandidate);'
          if old not in s:
              raise SystemExit('Expected Phase D saveMemory binding was not found; refusing to modify the file.')
          s = s.replace(old, new, 1)
          old_call = 'await saveMemoryCandidate({ data: { conversationId: conversationId!, messageId, content } });'
          new_call = 'await saveMemoryCandidateFn({ data: { conversationId: conversationId!, messageId, content } });'
          if old_call not in s:
              raise SystemExit('Expected Phase D saveMemory call was not found; refusing to modify the file.')
          s = s.replace(old_call, new_call, 1)
          p.write_text(s)
          PY
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/routes/_authenticated/chat.tsx; then
            echo 'No Phase D build fix needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/_authenticated/chat.tsx
          git commit -m 'fix: resolve Phase D chat memory binding collision'
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/phase-d-build-fix.yml
          git commit -m 'chore: remove temporary Phase D build fixer'
          git push
