name: Phase M Validation
on:
  push:
    branches: [main]
    paths:
      - 'src/lib/aether/agent-*.ts'
      - 'src/lib/aether/agents.ts'
      - 'src/lib/aether/__tests__/agent-runtime.test.ts'
      - 'src/routes/_authenticated/admin/agents.tsx'
      - 'supabase/migrations/2026091115*.sql'
      - 'supabase/migrations/2026091118*.sql'
      - '.github/workflows/phase-m-validation.yml'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install
      - run: bunx tsc --noEmit
      - run: bunx vitest run src/lib/aether/__tests__/agent-runtime.test.ts
      - run: bun run build:dev
