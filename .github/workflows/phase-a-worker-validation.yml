name: Phase A Durable Runtime Validation

on:
  push:
    branches: [main, phase-a-runtime-hardening]
  pull_request:
    branches: [main]

jobs:
  durable-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.21'
      - name: Install dependencies
        run: bun install
      - name: Validate worker entrypoint
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: phase-a-validation-placeholder
        run: bun run scripts/aether-runtime-worker.ts --check
      - name: Validate runtime unit tests
        run: bun test src/lib/aether/task-runtime.test.ts
      - name: Production build
        run: bun run build:dev
