name: Phase S Validation
on:
  push:
    branches: [main]
    paths:
      - 'src/lib/aether/developer-api.ts'
      - 'src/lib/aether/developer-api.functions.ts'
      - 'src/lib/aether/__tests__/developer-api.test.ts'
      - 'src/routes/api/v1/**'
      - 'src/routes/_authenticated/api-keys.tsx'
      - 'src/routes/_authenticated/developer-api.tsx'
      - 'supabase/migrations/**phase_s**'
      - 'tsconfig.phase-s.json'
      - '.github/workflows/phase-s-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/aether/developer-api.ts'
      - 'src/lib/aether/developer-api.functions.ts'
      - 'src/lib/aether/__tests__/developer-api.test.ts'
      - 'src/routes/api/v1/**'
      - 'src/routes/_authenticated/api-keys.tsx'
      - 'src/routes/_authenticated/developer-api.tsx'
      - 'supabase/migrations/**phase_s**'
      - 'tsconfig.phase-s.json'
      - '.github/workflows/phase-s-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.21'
      - run: bun install
      - run: bunx tsc -p tsconfig.phase-s.json --noEmit
      - run: bunx vitest run src/lib/aether/__tests__/developer-api.test.ts
      - run: bun run build:dev
