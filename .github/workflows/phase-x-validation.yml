name: Phase X Security Validation

on:
  pull_request:
    paths:
      - "src/lib/aether/security.ts"
      - "src/lib/aether/security-boundary.ts"
      - "src/lib/aether/untrusted-content.ts"
      - "src/lib/aether/phase-x-security.test.ts"
      - "src/routes/api/v1/**"
      - ".github/workflows/phase-x-validation.yml"
  push:
    branches: [main]

jobs:
  security-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"
      - run: bun install
      - name: Phase X security tests
        run: bunx vitest run src/lib/aether/phase-x-security.test.ts
      - name: Runtime worker entrypoint check
        run: bun run scripts/aether-runtime-worker.ts --check
        env:
          SUPABASE_URL: https://example.invalid
          SUPABASE_SERVICE_ROLE_KEY: phase-x-validation-placeholder
      - name: Production build
        run: bun run build:dev
