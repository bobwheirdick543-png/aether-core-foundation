name: Aether One-Time Format Repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aether-format-repair.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install
      - name: Apply repository lint fixes
        run: bun run lint -- --fix
      - name: Commit formatter repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git add -A
          git commit -m "chore: format repository"
          git push origin HEAD:main
